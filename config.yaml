# ==========================================
# Trading Pipeline Configuration
# ==========================================

data_settings:
  lookback_years: 9          
  selected_tickers:
    - GOOGL             

  news_keywords:
    GOOGL: 'google|alphabet'
    
sources:
  use_tiingo_stocks: true
  use_tiingo_spy: true
  use_yfinance_vix: true
  use_bigquery_news: true
  # Set to true for local testing, false for server automation
  require_bq_confirmation: true

data_path:
  raw: 
    OHLCV: "data/raw/OHLCV"
    FUNDAMENTALS: "data/raw/FUNDAMENTALS"
    NEWS: "data/raw/NEWS"
  features: "data/features"
  models: "data/models"

trading_setup:
  mode: paper
