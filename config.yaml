data_settings:
  lookback_years: 10
  selected_tickers:
  - AAPL
  news_keywords:
    AAPL: apple|iphone
sources:
  use_tiingo_stocks: true
  use_tiingo_spy: true
  use_yfinance_vix: true
  use_alphavantage_fundamentals: true
  use_bigquery_news: false
  require_bq_confirmation: false
data_path:
  raw:
    OHLCV: data/raw/OHLCV
    FUNDAMENTALS: data/raw/FUNDAMENTALS
    NEWS: data/raw/NEWS
  features: data/features
  models: data/models
random_seed: 42
target_columns:
- Target_1D
- Target_3D
- Target_5D
- Target_7D
- Target_10D
target_horizons:
- 1
- 3
- 5
- 7
- 10
target_rolling_window: 252
exclude_columns:
- adjOpen
- adjHigh
- adjLow
- adjClose
- adjVolume
- open
- high
- low
- close
- volume
- splitFactor
- divCash
- Net_Income_TTM
- EPS_TTM
- Total_Equity
- Book_Value_Per_Share
- Shares_Outstanding
- SMA10
- SMA20
- EMA10
- EMA20
- SPY_Close
- SPY_Open
- SPY_High
- SPY_Low
- SPY_Volume
- VIX_Close
- VIX_Open
- VIX_High
- VIX_Low
- VIX_Volume
- EPS_Raw
- EPS
- Net_Income
best_features_path: data/models/best_features_AAPL.json
model_params:
  sequence_length: 6
  hidden_size: 64
  num_layers: 3
  dropout: 0.11141008356607306
  epochs: 100
  patience: 25
  batch_size: 64
  learning_rate: 0.0007508360878354052
walk_forward:
  min_train_size: 500
  test_size: 60
  gap: 20
  step_size: 40
  max_train_size: null
backtest:
  initial_capital: 100000
  position_size: 0.9
  transaction_cost: 0.001
  prob_threshold: 75
  sl_multiplier: 2.0
  atr_column: ATR14
  strength_mode: z_score
  start_date: '2025-01-01'
  end_date: '2026-06-12'
trading_setup:
  mode: paper
  live_threshold: 0.7
