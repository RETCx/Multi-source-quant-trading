# ==========================================
# Trading Pipeline Configuration
# ==========================================

# --- Data Settings ---
data_settings:
  lookback_years: 10          
  selected_tickers:
    - GOOGL             

  news_keywords:
    GOOGL: 'google|alphabet'
    
sources:
  use_tiingo_stocks: true
  use_tiingo_spy: true
  use_yfinance_vix: true
  use_bigquery_news: true
  require_bq_confirmation: true

data_path:
  raw: 
    OHLCV: "data/raw/OHLCV"
    FUNDAMENTALS: "data/raw/FUNDAMENTALS"
    NEWS: "data/raw/NEWS"
  features: "data/features"
  models: "data/models"

# --- Reproducibility ---
random_seed: 42

# --- Target Columns (Multi-Horizon Labels) ---
target_columns:
  - Target_1D
  - Target_3D
  - Target_5D
  - Target_7D
  - Target_10D
  
target_horizons: [1, 3, 5, 7, 10]
target_rolling_window: 252    # Rolling Percentile window (~1 year of trading days)

# --- Feature Exclusion List ---
# Columns to exclude from model features
# (price columns needed for backtest, noisy/redundant indicators)
exclude_columns:
  # Raw price columns (needed for backtest but NOT for model input)
  - adjOpen
  - adjHigh
  - adjLow
  - adjClose
  - adjVolume
  - open
  - high
  - low
  - close
  - volume
  - splitFactor
  - divCash
  - Net_Income_TTM
  - EPS_TTM
  - Total_Equity
  - Book_Value_Per_Share
  - Shares_Outstanding
  - SMA10
  - SMA20
  - EMA10
  - EMA20
  - SPY_Close
  - SPY_Open
  - SPY_High
  - SPY_Low
  - SPY_Volume
  - VIX_Close
  - VIX_Open
  - VIX_High
  - VIX_Low
  - VIX_Volume
  - EPS_Raw
  - EPS
  - Net_Income

# Use best features from feature selection (set to null to use all features)
best_features_path: "data/models/best_features_GOOGL.json"

# --- Multi-Head LSTM Parameters ---
model_params:
  sequence_length: 15         # Lookback window (15 trading days)
  hidden_size: 64             # LSTM hidden units
  num_layers: 2               # Number of stacked LSTM layers
  dropout: 0.3                # Dropout rate for regularization
  epochs: 100                 # Maximum training epochs
  patience: 25                # Early stopping patience (epochs without improvement)
  batch_size: 64             # Training batch size
  learning_rate: 0.001        # Adam optimizer learning rate

# --- Walk-Forward CV Configuration ---
walk_forward:
  min_train_size: 500         # Minimum training window (~2 years of trading days)
  test_size: 60               # OOS test window per fold (~3 months)
  gap: 20                     # Embargo gap to prevent data leakage (~1 month)
  step_size: 40               # Slide step (overlap = test_size - step_size = 20 days)
  max_train_size: null         # null = Expanding Window, integer = Sliding Window

# --- Backtest Configuration ---
backtest:
  initial_capital: 100000
  position_size: 0.7         # Percentage of capital to invest per trade (1.0 = 100%)
  transaction_cost: 0.001     # 0.1% per trade (entry + exit)
  prob_threshold: 70          # Percentile for adaptive probability threshold
  sl_multiplier: 2.0          # ATR multiplier for Stop Loss
  atr_column: ATR14           # Column name for ATR in the feature CSV
  start_date: "2025-01-01"    # Backtest start date (null = use all data)
  end_date:   "2026-01-31"    # Backtest end date   (null = use all data)

# --- Trading Setup ---
trading_setup:
  mode: paper
  live_threshold: 0.70        # Absolute probability threshold for live execution (e.g. 0.70 means 70% confidence)
